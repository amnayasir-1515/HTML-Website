<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
        content="width=device-width,initial-scale=1.0">
        <title>Reponsive Website</title>
        
        <style>
            body{
                background-color:aliceblue ;
            }
            .box{
                width:500px;
                height:300px;
                background-color: lightskyblue;
                border: 2px solid navy;
                text-align: center;
                font-size: 30px;
                margin: 20px auto;
            }
            @media  (max-width: 600px){
                .box{
                    width: 250px;
                    background-color: pink;
                    font-size: 20px;
                }
            }  
        </style>
    </head>
    <body>
        <div class="box">
            <div class=".box"> <h1>Reponsive Website</h1></div>
            <div class=".box"> <p>This webpage changes its layout accourding to the screen size</p> </div>

        </div>
    </body>
</html>
