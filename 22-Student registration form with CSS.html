<!DOCTYPE html>
<html>
    <head>
        <title>Registration Form</title>
        <style>
            body{
                background:linear-gradient(to right,pink,rgb(162, 162, 248));
                font-weight: bold;
                
            }
            h1{
                color:navy;
                background-color:white;
                font-size: 35px;
                border:3px solid rgb(28, 28, 77);
                width:450px;
                margin: auto;
                border-radius:10px;
                text-align: center;
            }
            h2 label{
                color:midnightblue;
                font-size: 26px;
                font-family:'Times New Roman';
                font-weight: bold;

            } 
            input{
                border-radius: 15px;
                border-color: rgb(61, 61, 119);
                height: 60px;
                font-size: 18px;
                width:400px;
                font-family: 'Times New Roman';
    

            }
            label{
                font-size: 20px;
                color:black;
            }
            input[type="checkbox"]{
                width: 22px;
                height: 22px;
            }
            input[type="radio"]{
                width:20px;
                height:20px;
            }
            button{
                color: aliceblue;
                background-color: darkolivegreen;
                width: 100px;
                height: 50px;

            }
        </style>
    </head>
    <body>
        <h1>Student Registration Form</h1>
        <form>
            <h2><label>Full Name:</label></h2>
            <input type="text" placeholder="Enter your name">
            <h2><label>Age:</label></h2>
            <input type="text" placeholder="Enter your age">
            <h2><label>Email:</label></h2>
            <input type="email" placeholder="Enter your email">
            <h2><label>Password:</label></h2>
            <input type="password" placeholder="Enter your password">
            <h2><label>Phone number:</label></h2>
            <input type="text" placeholder="Enter your phone number">
            <h2><label>Date Of Birth:</label></h2>
            <input type="Date" placeholder="Enter your DOB"><br>
            <h2><label>Gender:</label></h2>
            <input type="radio" name="gender"><label>Male</label>
            <input type="radio" name="gender"><label>Female</label><br>
            <h2><label>Courses:</label></h2>
            <input type="checkbox"><label>HTML</label>
            <input type="checkbox"><label>CSS</label>
            <input type="checkbox"><label>Javascript</label><br>
            <h2><label>City:</label></h2>
            <select>
                <option>Faisalabad</option>
                <option>Lahore</option>
                <option>Islamabad</option>
                <option>Karachi</option>
            </select>
            <br>
            <h2><label>Address:</label></h2>
            <textarea rows="4" cols="30" placeholder="Enter your address"></textarea><br><br>
            <Button>Submit</Button><br><br>
        </form>
    </body>
</html>
