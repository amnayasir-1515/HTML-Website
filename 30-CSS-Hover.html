<!DOCTYPE html>
<html>
    <head>
        <title>CSS Hover</title>
        <style>
            button{
                background-color: green;
                color: aliceblue;
            }
            button:hover{
                background-color: red;
            }

        </style>
    </head>
    <body>
        <button>Click Me</button>
    </body>
</html>
