<!DOCTYPE html>
<html>
    <head>
        <title>Registration Form</title>
    </head>
    <body>
        <h1 align="Center">Student Registration Form</h1>
        <form>
            <h3><label>Full Name:</label></h3>
            <input type="text" placeholder="Enter your name">
            <h3><label>Age:</label></h3>
            <input type="text" placeholder="Enter your age">
            <h3><label>Email:</label></h3>
            <input type="text" placeholder="Enter your email">
            <h3><label>Password:</label></h3>
            <input type="text" placeholder="Enter your password">
            <h3><label>Password:</label></h3>
            <input type="text" placeholder="Enter your phone number">
            <h3><label>Date Of Birth:</label></h3>
            <input type="Date" placeholder="Enter your DOB"><br>
            <h3><label>Gender:</label></h3>
            <input type="radio" name="gender">Male
            <input type="radio" name="gender">Female<br>
            <h3><label>Courses:</label></h3>
            <input type="checkbox"> HTML
            <input type="checkbox"> CSS
            <input type="checkbox"> Javascript<br>
            <h3><label>City:</label></h3>
            <select>
                <option>Faisalabad</option>
                <option>Lahore</option>
                <option>Islamabad</option>
                <option>Karachi</option>
            </select>
            <br>
            <h3><label>Adress:</label></h3>
            <textarea rows="4" cols="30" placeholder="Enter your address"></textarea><br><br>
            <Button style="width:100px ; height:35px">Submit</Button>

        </form>
    </body>
</html>
