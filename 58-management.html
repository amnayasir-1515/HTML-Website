<!doctype html>
<html>
  <head>
    <title>Student Management System</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #dbeafe, #eef2ff);
        padding: 40px 20px;
      }

      .container {
        width: 80%;
        height: auto;
        margin: auto;
        background: white;
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      }

      h1 {
        text-align: center;
        margin: 0 0 30px;
        color: #1e293b;
        font-size: 36px;
      }

      input,
      select {
        width: 100%;
        height: 60px;
        padding: 20px 20px;
        margin-bottom: 15px;
        border: 1px solid #cbd5e1;
        border-radius: 9px;
        font-size: 18px;
        outline: none;
        background: #f8fafc;
      }

      input:focus,
      select:focus {
        border-color: #2563eb;
        background: white;
      }
      .input-row {
        display: flex;
        gap: 15px;
        margin-bottom: 15px;
      }

      .input-row input,
      .input-row select {
        width: 50%;
        margin-bottom: 0;
      }

      .action-row {
        display: flex;
        gap: 15px;
        margin-top: 15px;
        margin-bottom: 5px;
      }

      .action-group {
        height: 70px;
        display: flex;
        flex: 1;

        gap: 10px;
      }

      .action-group input {
        height: 55px;
        flex: 1;
        font-size: 18px;
        margin-bottom: 0;
      }

      .action-group button {
        width: 160px;
        height: 55px;
        margin-top: 0;
        font-size: 20px;
        color: white;
        background-color: rgb(53, 157, 53);
      }
      .action-group button:hover {
        background: green;
      }

      button {
        width: 100%;
        height: 60px;
        padding: 14px;
        margin-top: 10px;
        border: none;
        border-radius: 9px;
        background: #2563eb;
        color: white;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
      }

      button:hover {
        background: #1d4ed8;
        transform: translateY(-1px);
      }

      .button-row {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }

      .button-row button {
        flex: 1;
        margin-top: 0;
      }

      .result {
        width: 100%;
        min-height: 200px;
        margin-top: 25px;
        padding: 20px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        color: #334155;
        line-height: 1.8;
        font-size: 20px;
      }

      .result hr {
        border: none;
        border-top: 1px solid #cbd5e1;
        margin: 15px 0;
      }

      @media (max-width: 768px) {
  body {
    padding: 20px 10px;
  }

  .container {
    width: 100%;
    padding: 25px 15px;
  }

  h1 {
    font-size: 28px;
  }

  .input-row {
    flex-direction: column;
    gap: 0;
  }

  .input-row input,
  .input-row select {
    width: 100%;
    margin-bottom: 12px;
  }

  .action-row {
    flex-direction: column;
    gap: 10px;
  }

  .action-group {
    width: 100%;
  }

  .button-row {
    flex-direction: column;
    gap: 10px;
  }

  .button-row button {
    width: 100%;
    font-size: 16px;
  }

  .result {
    font-size: 17px;
  }
}
    </style>
    <script>
      const students = [];

      function getGrade(marks) {
        if (marks >= 80) {
          return "A";
        } else if (marks >= 70) {
          return "B";
        } else if (marks >= 60) {
          return "C";
        } else if (marks >= 50) {
          return "D";
        } else {
          return "F";
        }
      }

      const getstatus = (marks) => {
        if (marks >= 50) {
          return "Pass";
        } else {
          return "fail";
        }
      };

      function getDepartmentName(code) {
        switch (code) {
          case "AI":
            return "Artificial Intelligence";
          case "IT":
            return "Information Technology";
          case "CS":
            return "Computer Science";
          default:
            return "Unknown";
        }
      }

      function addStudent() {
        try {
          let name = document.getElementById("name").value;
          let rollNo = document.getElementById("rollNo").value;
          let age = Number(document.getElementById("age").value);
          let marks = Number(document.getElementById("marks").value);
          let percentage = Number(document.getElementById("percentage").value);

          let department = document.getElementById("department").value;

          if (
            name === "" ||
            rollNo === "" ||
            age <= 0 ||
            marks < 0 ||
            marks > 1000 ||
            percentage < 0 ||
            percentage > 100 ||
            department === ""
          ) {
            throw new Error("Please enter valid information");
          }

          let passed = marks >= 50;

          const student = {
            name: name,
            rollNo: rollNo,
            age: age,
            marks: marks,
            percentage: percentage,
            department: {
              code: department,
              name: getDepartmentName(department),
            },
            result: {
              grade: getGrade(marks),
              status: getstatus(marks),
            },
            passed: passed,
          };

          students.push(student);
          document.getElementById("result").innerHTML =
            "Student added successfully!";
        } catch (error) {
          document.getElementById("result").innerHTML = error.message;
        }
      }

      function showStudents() {
        let output = "";

        for (let i = 0; i < students.length; i++) {
          let student = students[i];

          output += `
          <div>
            <b>Student ${i + 1}</b><br>
            Name: ${student.name}<br>
            rollNo: ${student.rollNo}<br>
            Age: ${student.age}<br>
            Marks: ${student.marks}<br>
               
            Percentage: ${student.percentage}%<br>

            Department: ${student.department.name}<br>
           
            Grade: ${student.result.grade}<br>
            Status: ${student.result.status}
            <hr>
          </div>
        `;
        }

        if (students.length === 0) {
          output = "No students added.";
        }

        document.getElementById("result").innerHTML = output;
      }

      function searchStudent() {
        let searchName = document
          .getElementById("searchName")
          .value.toLowerCase();

        const result = students.filter(
          (student) => student.name.toLowerCase() === searchName,
        );

        if (result.length === 0) {
          document.getElementById("result").innerHTML = "Student not found.";
          return;
        }

        let output = "";

        result.forEach((student) => {
          output += `
      <div>
        <b>Student Found</b><br>
        Name: ${student.name}<br>
        Roll No: ${student.rollNo}<br>
        Age: ${student.age}<br>
        Marks: ${student.marks}<br>
        Percentage: ${student.percentage}%<br>
        Department: ${student.department.name}<br>
        Grade: ${student.result.grade}<br>
        Status: ${student.result.status}
        <hr>
      </div>
    `;
        });

        document.getElementById("result").innerHTML = output;
      }

      function deleteStudent() {
        let deleteName = document
          .getElementById("deleteName")
          .value.toLowerCase();

        const index = students.findIndex(
          (student) => student.name.toLowerCase() === deleteName,
        );

        if (index === -1) {
          document.getElementById("result").innerHTML = "Student not found.";
          return;
        }

        students.splice(index, 1);

        document.getElementById("result").innerHTML =
          "Student deleted successfully!";
      }


      function calculateAverage() {
        if (students.length === 0) {
          document.getElementById("result").innerHTML =
            "No students available.";

          return;
        }

        let total = 0;

        let i = 0;

        while (i < students.length) {
          total = total + students[i].marks;

          i++;
        }

        let average = total / students.length;

        document.getElementById("result").innerHTML =
          "Average Marks: " + average.toFixed(2);
      }

      function showDepartment() {
        let department = document.getElementById("department").value;

        if (department === "") {
          document.getElementById("result").innerHTML =
            "Please select a department.";

          return;
        }

        const result = students.filter(
          (student) => student.department.code === department,
        );

        let output = "";

        result.forEach((student) => {
          output += `
          <div>
            Name: ${student.name}<br>
            Marks: ${student.marks}<br>
            Grade: ${student.result.grade}
            <hr>
          </div>
        `;
        });

        if (result.length === 0) {
          output = "No student found.";
        }

        document.getElementById("result").innerHTML = output;
      }
    </script>
  </head>
  <body>
    <div class="container">
      <h1>Student Management System</h1>
      <div class="input-row">
        <input type="text" id="name" placeholder="Enter student name" />
        <input type="" id="rollNo" placeholder="Enter rollNo" />
      </div>
      <div class="input-row">
        <input type="number" id="age" placeholder="Enter age" />
        <input type="number" id="marks" placeholder="Enter marks" />
      </div>
      <div class="input-row">
        <input type="number" id="percentage" placeholder="Enter percentage" />

        <select id="department">
          <option value="">Select Department</option>
          <option value="AI">Artificial Intelligence</option>
          <option value="IT">Information Technology</option>
          <option value="CS">Computer Science</option>
        </select>
      </div>
      <div class="action-row">
        <div class="action-group">
          <input
            type="text"
            id="searchName"
            placeholder="Search student by name"
          />
          <button onclick="searchStudent()">Search</button>
        </div>

        <div class="action-group">
          <input
            type="text"
            id="deleteName"
            placeholder="Delete student by name"
          />
          <button onclick="deleteStudent()">Delete</button>
        </div>
      </div>
      <div class="button-row">
        <button onclick="addStudent()">Add Student</button>
        <button onclick="showStudents()">Show Students</button>
        <button onclick="calculateAverage()">Calculate Average</button>
        <button onclick="showDepartment()">Show Department</button>
      </div>
      <div class="result" id="result">Result will appear here</div>
    </div>
  </body>
</html>
