<!DOCTYPE html>
<html>
    <head>
        <title>Lists</title>
    </head>
    <body>
        <h2>Unordered List</h2>
        <ul>
            <li>Youtube</li>
            <li>Whatsapp</li>
            <li>Facebook</li>
        </ul>
        <h2>Ordered List</h2>
        <ol>
            <li>Designing</li>
            <li>Coding</li>
            <li>Reading Books</li>
        </ol>
        <h2>Description List</h2>
        <dl>
            <dt>HTML</dt>
            <dd>HTML is used to create the structure of a webpage</dd>
        </dl>
    </body>
</html>
